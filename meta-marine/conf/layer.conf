# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-marine"
BBFILE_PATTERN_meta-marine = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-marine = "6"

LAYERDEPENDS_meta-marine = "core"
LAYERSERIES_COMPAT_meta-marine = "wrynose"
